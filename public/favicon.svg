<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background -->
  <rect width="64" height="64" rx="10" fill="#120929"/>

  <!-- Building body -->
  <rect x="7" y="13" width="50" height="47" rx="3" fill="#863bff"/>

  <!-- Roof band -->
  <rect x="7" y="13" width="50" height="7" rx="3" fill="#5e18d4"/>
  <rect x="7" y="17" width="50" height="3" fill="#5e18d4"/>

  <!-- Rooftop antenna / detail -->
  <rect x="30" y="8" width="4" height="7" rx="1" fill="#5e18d4"/>
  <rect x="26" y="10" width="12" height="3" rx="1" fill="#5e18d4"/>

  <!-- Window row 1 (top) -->
  <rect x="11" y="14" width="7" height="4" rx="1" fill="white" opacity="0.22"/>
  <rect x="21" y="14" width="7" height="4" rx="1" fill="white" opacity="0.22"/>
  <rect x="39" y="14" width="7" height="4" rx="1" fill="#47bfff" opacity="0.55"/>
  <rect x="47" y="14" width="7" height="4" rx="1" fill="white" opacity="0.22"/>

  <!-- Window row 2 -->
  <rect x="11" y="23" width="7" height="4" rx="1" fill="white" opacity="0.18"/>
  <rect x="47" y="23" width="7" height="4" rx="1" fill="white" opacity="0.18"/>

  <!-- Window row 3 -->
  <rect x="11" y="31" width="7" height="4" rx="1" fill="white" opacity="0.15"/>
  <rect x="47" y="31" width="7" height="4" rx="1" fill="#47bfff" opacity="0.4"/>

  <!-- Big bold B - dominant element -->
  <text
    x="32"
    y="54"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="34"
    text-anchor="middle"
    fill="white"
    letter-spacing="-1"
  >B</text>

  <!-- Ground entrance -->
  <rect x="22" y="56" width="20" height="4" rx="1" fill="#5e18d4"/>
</svg>
