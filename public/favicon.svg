<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Black background -->
  <rect width="64" height="64" rx="8" fill="#000"/>

  <!-- Rooftop antenna -->
  <line x1="32" y1="7" x2="32" y2="13" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
  <line x1="27" y1="10" x2="37" y2="10" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>

  <!-- Building outer outline (sketch style) -->
  <rect x="7" y="13" width="50" height="47" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.4"/>

  <!-- Roof dividing line -->
  <line x1="7" y1="21" x2="57" y2="21" stroke="rgba(255,255,255,0.3)" stroke-width="0.9"/>

  <!-- Top window strip - left side -->
  <rect x="11" y="15" width="7" height="4" rx="0.5" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
  <rect x="21" y="15" width="7" height="4" rx="0.5" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>

  <!-- Top window strip - right side (blue tint) -->
  <rect x="36" y="15" width="7" height="4" rx="0.5" fill="none" stroke="rgba(56,189,248,0.55)" stroke-width="0.8"/>
  <rect x="46" y="15" width="7" height="4" rx="0.5" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>

  <!-- Vertical column dividers -->
  <line x1="22" y1="22" x2="22" y2="57" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
  <line x1="42" y1="22" x2="42" y2="57" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>

  <!-- Side windows - left column -->
  <rect x="11" y="25" width="7" height="4" rx="0.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.7"/>
  <rect x="11" y="33" width="7" height="4" rx="0.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.7"/>

  <!-- Side windows - right column -->
  <rect x="46" y="25" width="7" height="4" rx="0.5" fill="none" stroke="rgba(56,189,248,0.35)" stroke-width="0.7"/>
  <rect x="46" y="33" width="7" height="4" rx="0.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.7"/>

  <!-- Big blue B — dominant element -->
  <text
    x="32"
    y="54"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="34"
    text-anchor="middle"
    fill="#38bdf8"
  >B</text>

  <!-- Ground entrance sketch -->
  <rect x="23" y="57" width="18" height="3" rx="0.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
</svg>
